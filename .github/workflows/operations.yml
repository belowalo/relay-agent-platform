name: Production operations
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run test:operations
      - run: sh -n deploy/backup.sh && sh -n deploy/postgres/init.sh && sh -n deploy/redis-start.sh
      - run: npm audit --audit-level=high
      - run: npm run operations:qualify
      - name: SBOM and release artifacts
        if: success()
        run: |
          npm sbom --sbom-format cyclonedx > operations-results/sbom.cdx.json
          docker image inspect relay-operations:local --format '{{.Id}}' > operations-results/relay-image-id.txt
          docker save relay-operations:local relay-proxy:local relay-backup:local relay-postgres:local | gzip > operations-results/relay-image.tar.gz
          git archive --format=tar HEAD | gzip > operations-results/deployment-package.tar.gz
          cd operations-results
          sha256sum relay-image.tar.gz deployment-package.tar.gz sbom.cdx.json > SHA256SUMS
      - name: Scan release container
        if: success()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/operations-results:/results" aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --format json --output /results/vulnerabilities.json relay-operations:local
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --exit-code 1 --severity HIGH,CRITICAL relay-operations:local
      - name: Record infrastructure image findings for security review
        if: success()
        run: |
          node bin/operations-init.mjs .operations-private
          mkdir -p operations-results/infrastructure
          docker compose --profile tools --env-file .operations-private/production.env -f deploy/compose.production.yaml config --images | sort -u > operations-results/infrastructure/images.txt
          while IFS= read -r image; do
            report_id=$(printf '%s' "$image" | sha256sum | cut -c1-12)
            docker run --rm -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/operations-results/infrastructure:/results" aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --format json --output "/results/$report_id.json" "$image"
          done < operations-results/infrastructure/images.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: production-operations-${{ github.sha }}
          path: operations-results/
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: operations-evidence-${{ github.sha }}
          path: |
            operations-results/report.json
            operations-results/metrics.prom
            operations-results/observability.log
            operations-results/images.json
            operations-results/vulnerabilities.json
            operations-results/relay-image-id.txt
            operations-results/SHA256SUMS
            operations-results/sbom.cdx.json
            operations-results/infrastructure/
          retention-days: 14
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
