rule_files: [alerts.yml]
evaluation_interval: 15s
tests:
  - interval: 15s
    input_series:
      - series: 'up{job="relay",instance="api:4311"}'
        values: '0x20'
      - series: 'relay_queue_age_seconds{instance="worker:4311"}'
        values: '180x20'
      - series: 'relay_worker_heartbeat_age_seconds{instance="worker:4311"}'
        values: '90x20'
      - series: 'relay_dependency_ready{instance="api:4311"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: RelayUnavailable
        exp_alerts:
          - exp_labels: { job: relay, instance: 'api:4311', severity: critical }
            exp_annotations:
              {
                summary: Relay scrape unavailable,
                runbook: 'docs/production/OPERATIONS-RUNBOOKS.md#databasequeue-outage',
              }
      - eval_time: 5m
        alertname: RelayQueueAge
        exp_alerts:
          - exp_labels: { instance: 'worker:4311', severity: warning }
            exp_annotations: { summary: Oldest waiting job exceeds two minutes }
      - eval_time: 5m
        alertname: RelayWorkerStale
        exp_alerts:
          - exp_labels: { instance: 'worker:4311', severity: critical }
            exp_annotations: { summary: Worker heartbeat stale }
      - eval_time: 5m
        alertname: RelayDependencyUnavailable
        exp_alerts:
          - exp_labels: { instance: 'api:4311', severity: critical }
            exp_annotations: { summary: Relay dependency unavailable }
  - interval: 15s
    input_series:
      - series: 'relay_workers_alive{instance="api:4311"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: RelayWorkerStale
        exp_alerts:
          - exp_labels: { instance: 'api:4311', severity: critical }
            exp_annotations: { summary: Worker heartbeat stale }
